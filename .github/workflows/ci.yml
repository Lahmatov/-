name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — типы, тесты, сборка
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bookshelf
          POSTGRES_PASSWORD: bookshelf
          POSTGRES_DB: bookshelf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bookshelf" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bookshelf:bookshelf@localhost:5432/bookshelf
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-not-for-production
      AUTH_TRUST_HOST: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma db push
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ios:
    name: iOS — сборка и тесты
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Генерация проекта
        working-directory: ios
        run: xcodegen
      - name: Сборка и тесты в симуляторе
        working-directory: ios
        run: |
          SIM=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+( Pro)?' | head -1)
          echo "Симулятор: $SIM"
          xcodebuild test \
            -project Bookshelf.xcodeproj \
            -scheme Bookshelf \
            -destination "platform=iOS Simulator,name=$SIM" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
      - name: Причины падений тестов
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/TestResults.xcresult" > "$RUNNER_TEMP/tests.json" || exit 0
          python3 ios/scripts/print_test_failures.py "$RUNNER_TEMP/tests.json"
      - name: Отчёт xcresult
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
