name: TestFlight

# Сборка iOS-приложения (mobile/, Expo) и загрузка в TestFlight. Запуск вручную (Actions → TestFlight → Run workflow)
# или пушем тега v* (например, v0.2.0). Секреты — mobile/README.md, раздел «Выпуск».
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Сборка и загрузка в TestFlight
    runs-on: macos-15
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ secrets.APP_BUNDLE_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Проверка секретов
        working-directory: .
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID APP_BUNDLE_ID API_BASE_URL; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Не заданы секреты:$missing — Settings → Secrets and variables → Actions (см. mobile/README.md)"
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL должен начинаться с https://"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci

      - name: Нативный проект (expo prebuild + pod install)
        run: npx expo prebuild --platform ios
        env:
          CI: "1"

      - name: Ключ App Store Connect
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          cp release/ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"

      - name: Архив
        working-directory: mobile/ios
        run: |
          xcodebuild archive \
            -workspace Polka.xcworkspace \
            -scheme Polka \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Polka.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -quiet

      - name: Загрузка в TestFlight
        working-directory: mobile/ios
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Polka.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Сборка ${{ github.run_number }} загружена. Через 10–30 минут она появится в App Store Connect → TestFlight."

      - name: Удалить ключ
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
