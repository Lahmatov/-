<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR-карточки для квеста</title>
<style>
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:20px;background:#f4f1ee;color:#222}
  .help{max-width:800px;margin:0 auto 20px;background:#fff;border-radius:12px;padding:16px 20px;line-height:1.5}
  .help code{background:#eee;padding:2px 6px;border-radius:5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;max-width:800px;margin:0 auto}
  .item{break-inside:avoid}
  .card{background:#fff;border:2px dashed #c9a; border-radius:16px;padding:16px;text-align:center}
  .card h3{margin:0 0 4px;font-family:Georgia,serif;font-size:20px;color:#7a2d55}
  .card .sub{font-size:13px;color:#888;margin-bottom:10px}
  .qr{display:flex;justify-content:center}
  .word{margin-top:10px;font:800 20px/1 system-ui;letter-spacing:.15em;color:#7a2d55}
  .note{font-size:13px;color:#555;background:#fff3c4;border-radius:8px;padding:6px 10px;margin-top:6px}
  @media print{ body{background:#fff;padding:0} .help,.note{display:none} .grid{gap:10px} }
</style>
</head>
<body>
<div class="help">
  <b>Как пользоваться:</b> распечатай эту страницу (или сделай скриншоты) и разрежь по пунктиру.
  Жёлтые заметки «куда спрятать» на печать не выводятся.<br>
  Ссылка в QR-кодах: <code id="base"></code><br>
  Карточку <b>«Старт»</b> отдай Карине утром (например, с цветами). Остальные спрячь по местам.
</div>
<div class="grid" id="grid"></div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  var p = new URLSearchParams(location.search);
  var base = p.get("base") || new URL("./", location.href).href;
  document.getElementById("base").textContent = base;
  var grid = document.getElementById("grid");
  var items = [{title:"Старт 🎉", sub:"Наведи камеру iPhone", url:base, word:"", note:"Отдать в руки утром"}];
  var n = 0;
  GAME.steps.forEach(function(s){
    if(s.type!=="hunt") return; n++;
    items.push({title:"Тайник №"+n+" ✨", sub:"Отсканируй в игре или камерой", url:base+"?k="+encodeURIComponent(s.key), word:s.key, note:"Спрятать: "+(s.place||s.title)});
  });
  items.forEach(function(it){
    var d=document.createElement("div"); d.className="item";
    d.innerHTML='<div class="card"><h3>'+it.title+'</h3><div class="sub">'+it.sub+'</div><div class="qr"></div>'+
      (it.word?'<div class="word">'+it.word+'</div>':'')+'</div><div class="note">'+it.note+'</div>';
    grid.appendChild(d);
    new QRCode(d.querySelector(".qr"),{text:it.url,width:180,height:180,correctLevel:QRCode.CorrectLevel.M});
  });
</script>
</body>
</html>
