# Проект Xcode генерируется из этого файла: `brew install xcodegen && xcodegen`
name: Bookshelf
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  # Загрузка и дисковый кэш обложек — видны и без сети.
  Nuke:
    url: https://github.com/kean/Nuke
    from: 12.8.0

targets:
  Bookshelf:
    type: application
    platform: iOS
    sources:
      - path: Bookshelf
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Bookshelf
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Bookshelf/Info.plist
      properties:
        CFBundleDisplayName: Полка
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Камера нужна, чтобы сканировать штрихкод (ISBN) на обложке книги.
        # Адрес сервера и Google Client ID берутся из Config/*.xcconfig
        API_BASE_URL: $(API_BASE_URL)
        AppGroupID: $(APP_GROUP_ID)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        # Разрешает http://localhost для разработки в симуляторе
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Bookshelf/Bookshelf.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # Push-уведомления (APNs). Для Release-сборки в App Store поменяйте на production.
        aps-environment: development
        # Общий контейнер с виджетом
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: BookshelfWidget

  BookshelfWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: BookshelfWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widget
        PRODUCT_NAME: BookshelfWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: BookshelfWidget/Info.plist
      properties:
        CFBundleDisplayName: Полка
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BookshelfWidget/BookshelfWidget.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  BookshelfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BookshelfUITests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Bookshelf

  BookshelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BookshelfTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Bookshelf

schemes:
  Bookshelf:
    build:
      targets:
        Bookshelf: all
    test:
      targets: [BookshelfTests, BookshelfUITests]
