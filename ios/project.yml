# Проект Xcode генерируется из этого файла: `brew install xcodegen && xcodegen`
name: Bookshelf
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  Bookshelf:
    type: application
    platform: iOS
    sources:
      - path: Bookshelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: Bookshelf
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Bookshelf/Info.plist
      properties:
        CFBundleDisplayName: Полка
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Адрес сервера и Google Client ID берутся из Config/*.xcconfig
        API_BASE_URL: $(API_BASE_URL)
        GIDClientID: $(GOOGLE_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        # Разрешает http://localhost для разработки в симуляторе
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Bookshelf/Bookshelf.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn

  BookshelfTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BookshelfTests
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Bookshelf

schemes:
  Bookshelf:
    build:
      targets:
        Bookshelf: all
    test:
      targets: [BookshelfTests]
