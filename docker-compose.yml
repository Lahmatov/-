# Сервер на своём VPS: `docker compose up -d`. Caddy сам получает HTTPS-сертификат для DOMAIN.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:/data/bookshelf.db
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env, например books.example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    depends_on:
      - app

volumes:
  data:
  caddy:
